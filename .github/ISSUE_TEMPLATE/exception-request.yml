name: "Exception request: resource-address scope"
description: "Exempt specific resource ADDRESSES from a Sentinel policy (or the whole policy for a workspace). Use this for most policies."
title: "[Exception][Resource]: <policy> in <workspace>"
labels: ["exception-request", "exc-resource-address"]
body:
  - type: markdown
    attributes:
      value: |
        Request an exception that exempts one or more **resource addresses** from a Sentinel policy in a specific workspace.
        Leave **Resource addresses** empty to request a **blanket** exception for the whole policy in that workspace.
        See the [Sentinel Policy Exception Workflow](https://paypal.atlassian.net/wiki/spaces/CLPE/pages/3023971297) for guidance.
  - type: input
    id: org
    attributes:
      label: Organization
      description: The TFE organization name.
      placeholder: gcp-dev-cnlz-portfolios
    validations:
      required: true
  - type: input
    id: workspace
    attributes:
      label: Workspace (ID or name)
      description: The workspace id (ws-…, preferred) or its name. Matched against either.
      placeholder: d-usc1-app-int  or  ws-AbC123…
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: Environment
      description: Which policy-set environment this workspace runs in (selects the exceptions file).
      options:
        - dev
        - infradev
        - prod
    validations:
      required: true
  - type: dropdown
    id: policy
    attributes:
      label: "Policy (domain: policy name)"
      description: "The domain-qualified Sentinel exception policy to request against. Only address-scoped policies are listed here."
      options:
        - "ccoe-mgmt: allowed-iam-roles"
        - "ccoe-mgmt: allowed-machine-types"
        - "ccoe-mgmt: approved-services-validation"
        - "ccoe-mgmt: bigquery-encryption"
        - "ccoe-mgmt: cloud-sql-encryption"
        - "ccoe-mgmt: cloud-sql-ssl"
        - "ccoe-mgmt: denied-iam-roles-playground"
        - "ccoe-mgmt: denied-provisioners"
        - "ccoe-mgmt: gce-disk-encryption"
        - "ccoe-mgmt: gcs-encryption"
        - "ccoe-mgmt: gcs-public-access"
        - "ccoe-mgmt: prevent-privileged-iam-bindings"
        - "ccoe-mgmt: prevent-resource-deletion"
        - "ccoe-mgmt: prevent-user-iam-bindings"
        - "ccoe-mgmt: project-configuration-standards"
        - "ccoe-mgmt: project-labels-validation"
        - "ccoe-mgmt: project-metadata-validation"
        - "ccoe-mgmt: project-naming-standards"
        - "dns: dns-name-validation"
        - "dns: dns-record-set-name-validation"
        - "fleet-mgmt: gke-allowed-machine-types"
        - "fleet-mgmt: gke-cluster-operational-config"
        - "fleet-mgmt: gke-network-validations"
        - "fleet-mgmt: gke-node-pool-config-validations"
        - "fleet-mgmt: gke-observability-validations"
        - "fleet-mgmt: gke-required-labels"
        - "fleet-mgmt: gke-security-validations"
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason / justification
      description: Why is this exception needed? Include business context.
      placeholder: Legacy bucket cannot be re-encrypted without downtime; migration tracked separately.
    validations:
      required: true
  - type: input
    id: expiry_date
    attributes:
      label: Expiry date
      description: "Last day the exception is valid (UTC, YYYY-MM-DD), or the literal 'never' for a permanent exception (discouraged — justify above)."
      placeholder: 2026-12-31
    validations:
      required: true
  - type: textarea
    id: resources
    attributes:
      label: Resource addresses (one per line)
      description: "Terraform resource addresses to exempt, one per line. Wildcards supported: name[*] and prefix_*. Leave EMPTY for a blanket exception covering the whole policy in this workspace."
      placeholder: |
        google_storage_bucket.legacy
        module.data.google_storage_bucket.archive[*]
    validations:
      required: false
